x-app-env: &app_env
  RAG_DATABASE_URL: postgresql+asyncpg://rag:rag@db:5432/rag
  RAG_REDIS_URL: redis://redis:6379/0
  RAG_JWT_SECRET: dev-only-jwt-secret-do-not-deploy  # local compose only
  # PYTHONPATH precedes site-packages on sys.path, so the bind-mounted source
  # shadows the copy baked into the image -> live reload without rebuilds.
  PYTHONPATH: /app/src

services:
  db:
    # pgvector baked into the official postgres image; needed from stage 2 on,
    # chosen now so the volume/schema never has to migrate images.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag  # local-dev-only credential, never used elsewhere
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RAG_DATABASE_URL: postgresql+asyncpg://rag:rag@db:5432/rag
      RAG_REDIS_URL: redis://redis:6379/0
      RAG_JWT_SECRET: dev-only-jwt-secret-do-not-deploy  # local compose only
      RAG_ENVIRONMENT: dev
      # PYTHONPATH precedes site-packages on sys.path, so the bind-mounted
      # source below shadows the copy baked into the image -> live reload.
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src
    command: ["uvicorn", "rag_platform.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      RAG_API_URL: http://api:8000
      # No ambient credential: users log in through the UI with a tenant
      # client_id/secret (create one with `rag_platform.cli create-credential`),
      # and each browser session acts as its own tenant.
    depends_on:
      - api

  # optional observability stack: docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [observability]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin  # local-dev only, like the db password
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"  # 3000 belongs to the web UI; grafana moves over one
    depends_on:
      - prometheus

volumes:
  pgdata:
