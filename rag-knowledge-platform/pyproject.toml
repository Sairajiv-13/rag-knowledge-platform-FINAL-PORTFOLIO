[project]
name = "rag-knowledge-platform"
version = "0.1.0"
description = "Multi-tenant RAG-as-a-service: ingest documents, serve grounded answers with citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "pgvector>=0.3,<0.5",
    "asyncpg>=0.29,<1.0",
    "redis>=5.0,<6.0",
    "structlog>=24.1,<26",
    "anthropic>=0.45,<2.0",
    "pypdf>=4.2,<6.0",
    "beautifulsoup4>=4.12,<5.0",
    "pyjwt>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "celery[redis]>=5.4,<6.0",
    "prometheus-client>=0.20,<1.0",
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.optional-dependencies]
# Heavy (pulls PyTorch). Only needed for the default local embedding model and
# the optional cross-encoder reranker; API can run with provider=fake without it.
local-inference = ["sentence-transformers>=3.0,<6.0"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes basics; I: import order; UP: modern syntax; B: bugbear (real bug catchers)
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["rag_platform"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# asyncpg and pgvector ship no type stubs; silencing just these imports
# beats a blanket ignore_missing_imports
module = ["asyncpg.*", "pgvector.*", "bs4.*", "sentence_transformers.*", "celery.*"]
ignore_missing_imports = true
