name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image, same as compose/prod — plain postgres would make
        # `CREATE EXTENSION vector` fail and test a schema we don't ship
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        # rate-limit tests need it (limiter fails open without it, and the
        # 429 tests skip — a silent skip in CI would be a hole, not a pass)
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RAG_DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
      RAG_REDIS_URL: redis://localhost:6379/0  # settings validation only; eager tests never connect
      RAG_JWT_SECRET: ci-only-secret-not-a-real-deployment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests migrations

      - name: Type-check (mypy)
        run: mypy

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Migration/model drift gate
        # upgrade a clean DB with the real migrations, then fail the build if
        # models.py and migrations disagree in either direction
        run: |
          alembic upgrade head
          alembic check

      - name: Integration tests
        # conftest creates+migrates its own rag_test database on the service
        run: pytest tests/integration -q

  docker:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        # build only — publishing is a deployment concern, not a CI gate.
        # Slow-ish (~torch-cpu download); acceptable for the gate it provides.
        run: docker build -t rag-knowledge-platform:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (includes type-check)
        run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format check
        run: terraform fmt -check -recursive -diff
      - name: Validate against provider schemas
        # -backend=false: validation needs providers/modules, not state
        run: |
          terraform init -backend=false
          terraform validate
