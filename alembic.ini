[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
# lets alembic import rag_platform even when the package isn't pip-installed
prepend_sys_path = src

# no sqlalchemy.url here on purpose: migrations/env.py reads it from Settings
# (RAG_DATABASE_URL), the same source of truth as the app. Zero secrets in-repo.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
